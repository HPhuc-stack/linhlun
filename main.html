<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cho m nè Linh lùn 🩵🐱🪻</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap');

:root {
  --blue-main: #4a80d6;
  --blue-soft: #e3effd;
  --blue-card: rgba(255, 255, 255, 0.88);
  --pink-accent: #ff6b81;
  --text-dark: #2c3e50;
  --white: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  font-family: 'Nunito', 'Quicksand', sans-serif;
  /* Background phong cách mây xanh pastel & họa tiết hoa lãng mạn */
  background: linear-gradient(135deg, #cde0f7 0%, #e8f2fc 40%, #dbe9f9 100%);
  color: var(--text-dark);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  position: relative;
}

/* Các hoa văn trang trí nền (Mèo, Hoa Lily xanh, Nơ Ruy-băng, Bướm, Mây) */
.bg-deco {
  position: fixed;
  font-size: 32px;
  opacity: 0.85;
  pointer-events: none;
  z-index: 1;
  animation: float 4s ease-in-out infinite alternate;
  filter: drop-shadow(0 4px 8px rgba(91, 146, 229, 0.15));
}
.deco-1 { top: 6%; left: 5%; animation-delay: 0s; }
.deco-2 { top: 10%; right: 6%; animation-delay: 1s; }
.deco-3 { bottom: 8%; left: 6%; animation-delay: 2s; }
.deco-4 { bottom: 10%; right: 5%; animation-delay: 1.5s; }
.deco-5 { top: 45%; left: 2%; animation-delay: 0.5s; }
.deco-6 { top: 50%; right: 2%; animation-delay: 2.5s; }

@keyframes float {
  0% { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-12px) rotate(8deg); }
}

/* Khung cửa sổ Trình duyệt Browser Glassmorphism */
.browser-container {
  width: min(880px, 94vw);
  background: var(--blue-card);
  backdrop-filter: blur(10px);
  border-radius: 28px;
  box-shadow: 0 20px 50px rgba(74, 128, 214, 0.22);
  border: 2px solid rgba(255, 255, 255, 0.9);
  overflow: hidden;
  position: relative;
  margin: 20px 0;
  z-index: 10;
}

.browser-bar {
  background: rgba(230, 241, 255, 0.9);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid #d5e5f7;
}

.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-red { background: #ff6b6b; }
.dot-yellow { background: #fabca1; }
.dot-green { background: #5cdb95; }

.browser-title {
  margin-left: 12px;
  font-size: 13px;
  color: #617d9c;
  font-weight: 600;
}

.page {
  padding: 40px 35px;
  min-height: 550px;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  animation: fadeIn 0.4s ease-in-out;
}

.page.active { display: flex; }

.intro-card {
  background: rgba(255, 255, 255, 0.95);
  border: 2px solid #d0e3f9;
  border-radius: 28px;
  padding: 35px 30px;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 12px 30px rgba(74, 128, 214, 0.1);
  position: relative;
}

.intro-card h1 {
  font-size: 32px;
  color: var(--blue-main);
  margin: 10px 0 15px;
  font-weight: 800;
}

.intro-card p {
  font-size: 16px;
  line-height: 1.7;
  color: #4a637d;
  margin: 10px 0;
}

.letter-box {
  background: rgba(255, 255, 255, 0.96);
  border-radius: 24px;
  border: 2px solid #d0e3f9;
  padding: 35px 30px;
  max-width: 650px;
  width: 100%;
  box-shadow: 0 15px 35px rgba(74, 128, 214, 0.12);
  text-align: left;
  position: relative;
}

/* Trang Kết Bìa Thiệp Phong Cách Blue Floral Ribbon */
.card-end-box {
  background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%);
  border-radius: 28px;
  border: 2px solid #bce0fd;
  padding: 40px 30px;
  max-width: 600px;
  width: 100%;
  box-shadow: 0 18px 40px rgba(74, 128, 214, 0.15);
  text-align: center;
  position: relative;
}

.card-end-box::before {
  content: '🎀 🪻 🦋 🐱 🎀';
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  background: #ffffff;
  padding: 2px 18px;
  border-radius: 20px;
  border: 1px solid #bce0fd;
  font-size: 16px;
}

.letter-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 2px dashed #d5e5f7;
  padding-bottom: 12px;
}

.letter-header h3 {
  margin: 0;
  color: var(--blue-main);
  font-size: 22px;
  font-weight: 800;
}

.letter-content {
  font-size: 15px;
  line-height: 1.8;
  color: #3b526b;
  white-space: pre-line;
}

.deco-icons-row {
  margin-bottom: 10px;
  font-size: 24px;
}

.music-card {
  background: #f0f7ff;
  border: 2px dashed #a8cdfc;
  border-radius: 16px;
  padding: 16px;
  margin-top: 20px;
  text-align: center;
}

.music-card p {
  margin: 0 0 10px 0;
  font-size: 14px;
  color: var(--blue-main);
  font-weight: 700;
}

.video-note {
  font-size: 13px;
  color: #7997b8;
  margin-top: 8px;
  font-style: italic;
  font-weight: 600;
  text-align: center;
}

.btn-primary {
  background: linear-gradient(135deg, var(--blue-main), #3a6ec0);
  color: white;
  border: none;
  padding: 13px 30px;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(74, 128, 214, 0.35);
  transition: all 0.2s ease;
  text-decoration: none;
  display: inline-block;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(74, 128, 214, 0.45);
}

.btn-secondary {
  background: #eaf3ff;
  color: var(--blue-main);
  border: 1.5px solid #bce0fd;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
  display: inline-block;
}

.btn-secondary:hover {
  background: var(--blue-main);
  color: white;
}

.nav-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 25px;
}

.drop-item {
  position: fixed;
  top: -40px;
  font-size: 28px;
  pointer-events: none;
  z-index: 999;
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translateY(105vh) rotate(360deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 650px) {
  .page { padding: 30px 20px; }
  .letter-box, .card-end-box { padding: 25px 20px; }
  .letter-header h3 { font-size: 18px; }
}
</style>
</head>
<body>

<!-- Nền Họa Tiết Soft Blue Lily & Bows -->
<div class="bg-deco deco-1">🎀 🪻</div>
<div class="bg-deco deco-2">🦋 🐈‍⬛</div>
<div class="bg-deco deco-3">☁️ 🤍</div>
